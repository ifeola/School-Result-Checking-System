name: CI

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main

permissions:
  contents: read
  
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Verify application
        run: pnpm run verify

      